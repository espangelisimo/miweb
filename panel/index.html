<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Panel · Solicitudes</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css?v=1624d2a9">
  <link rel="stylesheet" href="../css/site.css?v=c1ea3cb2">
  <link rel="stylesheet" href="panel.css?v=7e1a8dd1">
  <style>
    .filters { display: flex; flex-wrap: wrap; gap: .5rem; }
    .filters button { padding: .45rem .9rem; border-radius: 999px; border: 1px solid var(--border); background: #fff; font-size: var(--fs-sm); font-weight: 600; cursor: pointer; }
    .filters .csv { align-self: center; margin-left: .5rem; font-size: var(--fs-sm); font-weight: 600; }
    .filters button[aria-pressed="true"] { background: var(--ink-900); border-color: var(--ink-900); color: #fff; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: .75rem; margin-bottom: 1.25rem; }
    .stat { padding: 1rem 1.25rem; background: #fff; border: 1px solid var(--border); border-radius: var(--radius); }
    .stat b { display: block; font-family: var(--font-display); font-size: 1.6rem; color: var(--brand-ink); }
    .stat span { font-size: var(--fs-xs); color: var(--text-muted); }
    .list { display: grid; gap: .75rem; padding-bottom: 3rem; }
    .item { display: grid; grid-template-columns: 1fr auto; gap: .5rem 1.5rem; padding: 1.25rem; background: #fff; border: 1px solid var(--border); border-left: 4px solid var(--border); border-radius: var(--radius); }
    .item[data-estado="nueva"] { border-left-color: var(--accent-strong); }
    .item[data-estado="cliente"] { border-left-color: var(--brand); }
    .item[data-estado="descartado"] { opacity: .6; }
    .item h2 { font-size: var(--fs-lg); }
    .meta { font-size: var(--fs-xs); color: var(--text-muted); }
    .item p.msg { grid-column: 1 / -1; padding: .75rem 1rem; background: var(--bg-alt); border-radius: var(--radius-sm); font-size: var(--fs-sm); white-space: pre-wrap; }
    .links { display: flex; flex-wrap: wrap; gap: .5rem; grid-column: 1 / -1; font-size: var(--fs-sm); }
    .links a { font-weight: 600; }
    .side { display: grid; gap: .5rem; align-content: start; min-width: 170px; }
    .side select, .side textarea { width: 100%; padding: .5rem; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: var(--fs-sm); background: #fff; }
    .side textarea { min-height: 64px; resize: vertical; }
    .del { justify-self: start; border: 0; background: none; color: #b42318; font-size: var(--fs-xs); cursor: pointer; text-decoration: underline; }
    .empty, .error { padding: 2rem; text-align: center; background: #fff; border-radius: var(--radius); color: var(--text-muted); }
    @media (max-width: 640px) { .item { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="header is-scrolled">
    <div class="container">
      <a class="logo" href="../"><img src="../assets/logo-mark.png" alt="" width="480" height="184"><span>web<b>sin</b>lio</span></a>
      <nav class="pnav" aria-label="Panel"><a href="./" aria-current="page">Solicitudes</a><a href="webs">Webs y demos</a><a href="auditoria">Auditoría</a></nav>
    </div>
  </header>
  <main class="container">
    <div class="bar">
      <h1>Solicitudes</h1>
      <div class="filters" role="group" aria-label="Filtrar por estado">
        <button aria-pressed="true" data-f="">Todas</button>
        <button aria-pressed="false" data-f="nueva">Nuevas</button>
        <button aria-pressed="false" data-f="contactado">Contactadas</button>
        <button aria-pressed="false" data-f="cliente">Clientes</button>
        <button aria-pressed="false" data-f="descartado">Descartadas</button>
        <a class="csv" href="../api/panel/solicitudes?formato=csv">Descargar Excel (CSV)</a>
      </div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="list" id="list"><p class="empty">Cargando…</p></div>
  </main>

  <script>
    const API = '../api/panel/solicitudes';
    const ESTADOS = { nueva: 'Nueva', contactado: 'Contactado', cliente: 'Cliente', descartado: 'Descartado' };
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const fecha = s => new Date(s.replace(' ', 'T') + 'Z').toLocaleString('es-ES', { dateStyle: 'medium', timeStyle: 'short' });
    const wa = t => 'https://wa.me/' + t.replace(/[^\d+]/g, '').replace(/^\+/, '').replace(/^(?!34)/, '34');
    let data = [], filtro = '';

    async function cargar() {
      const res = await fetch(API, { credentials: 'same-origin' });
      if (!res.ok) {
        document.getElementById('list').innerHTML = `<p class="error">No se han podido cargar las solicitudes (${res.status}). ${res.status === 401 ? 'Vuelve a iniciar sesión recargando la página.' : ''}</p>`;
        return;
      }
      data = await res.json();
      pintar();
    }

    function pintar() {
      const c = e => data.filter(d => d.estado === e).length;
      document.getElementById('stats').innerHTML =
        `<div class="stat"><b>${data.length}</b><span>Total</span></div>` +
        Object.entries(ESTADOS).map(([k, v]) => `<div class="stat"><b>${c(k)}</b><span>${v}</span></div>`).join('');
      const rows = data.filter(d => !filtro || d.estado === filtro);
      document.getElementById('list').innerHTML = rows.length ? rows.map(d => `
        <article class="item" data-estado="${d.estado}" data-id="${d.id}">
          <div>
            <h2>${esc(d.negocio || d.nombre)}</h2>
            <p class="meta">${fecha(d.creado)} · ${esc(d.necesidad || '—')} · ${esc(d.nombre)}</p>
          </div>
          <div class="side">
            <select aria-label="Estado">${Object.entries(ESTADOS).map(([k, v]) => `<option value="${k}" ${k === d.estado ? 'selected' : ''}>${v}</option>`).join('')}</select>
          </div>
          ${d.mensaje ? `<p class="msg">${esc(d.mensaje)}</p>` : ''}
          <div class="links">
            <a href="mailto:${esc(d.email)}">${esc(d.email)}</a>
            ${d.telefono ? `· <a href="tel:${esc(d.telefono)}">${esc(d.telefono)}</a> · <a href="${wa(d.telefono)}" target="_blank" rel="noopener">WhatsApp</a>` : ''}
          </div>
          <div class="side" style="grid-column:1/-1">
            <textarea placeholder="Notas internas (se guardan al salir del campo)" aria-label="Notas">${esc(d.notas)}</textarea>
            <button class="del" type="button">Borrar solicitud</button>
          </div>
        </article>`).join('') : '<p class="empty">No hay solicitudes con este filtro.</p>';
    }

    async function guardar(id, cambios) {
      const res = await fetch(API, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id, ...cambios }) });
      if (!res.ok) return alert('No se ha podido guardar.');
      Object.assign(data.find(d => d.id === id), cambios);
      pintar();
    }

    const list = document.getElementById('list');
    list.addEventListener('change', e => {
      const id = Number(e.target.closest('.item')?.dataset.id);
      if (e.target.matches('select')) guardar(id, { estado: e.target.value });
    });
    list.addEventListener('focusout', e => {
      if (!e.target.matches('textarea')) return;
      const id = Number(e.target.closest('.item').dataset.id);
      if (e.target.value !== (data.find(d => d.id === id).notas ?? '')) guardar(id, { notas: e.target.value });
    });
    list.addEventListener('click', async e => {
      if (!e.target.matches('.del')) return;
      const id = Number(e.target.closest('.item').dataset.id);
      if (!confirm('¿Borrar esta solicitud para siempre?')) return;
      const res = await fetch(`${API}?id=${id}`, { method: 'DELETE' });
      if (res.ok) { data = data.filter(d => d.id !== id); pintar(); }
    });
    document.querySelector('.filters').addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      filtro = b.dataset.f;
      document.querySelectorAll('.filters button').forEach(x => x.setAttribute('aria-pressed', x === b));
      pintar();
    });
    cargar();
  </script>
</body>
</html>
